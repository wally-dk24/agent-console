# Agent Console — thin API client for the Pi.
# Image: docker.io/wallydk24/agent-console:latest (amd64, arm64, 386)
#
# 1. Set API_BASE_URL to your Agent Console Data API
#    (e.g. https://agent-console-api.<your-subdomain>.workers.dev)
# 2. Set API_TOKEN to the bearer token for that API.
# 3. docker compose up -d
# 4. Open http://<host>:8080 — no login, it opens straight into the console.
#    (Trusted-LAN build: anyone who can reach the port can use it, but all
#    data comes from your authenticated API upstream.)
#
# The bearer token stays server-side: the browser talks to this container
# on localhost, and the container attaches the token when calling upstream.
# No data files, no volumes.

services:
  agent-console:
    image: docker.io/wallydk24/agent-console:latest
    container_name: agent-console
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      PUID: "1000"
      PGID: "1000"
      API_BASE_URL: "https://agent-console-api.<your-subdomain>.workers.dev"
      API_TOKEN: "paste-your-bearer-token-here"
