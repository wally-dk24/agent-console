<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Console</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="app">

  <!-- main app -->
  <section id="view-app">
    <header class="topbar">
      <span class="brand">🧭 Agent Console</span>
      <nav>
        <button data-tab="files" class="tab active">Files</button>
        <button data-tab="activity" class="tab">Activity</button>
        <button data-tab="fleet" class="tab">Fleet</button>
      </nav>
    </header>

    <div id="tab-files" class="tabpane">
      <div class="filebar">
        <button id="nav-back" title="Back">←</button>
        <button id="nav-up" title="Up">↑</button>
        <nav id="crumbs" class="crumbs"></nav>
      </div>
      <div class="searchrow">
        <input id="search" type="search" placeholder="Search files… ( / )" autocomplete="off">
        <div id="typefilters" class="chips">
          <button data-type="" class="chip active">All</button>
          <button data-type="code" class="chip">Code</button>
          <button data-type="docs" class="chip">Docs</button>
          <button data-type="data" class="chip">Data</button>
          <button data-type="media" class="chip">Media</button>
        </div>
      </div>
      <div id="search-results" class="results hidden"></div>
      <div class="filemain">
        <div class="filelist">
          <div id="recent" class="recents hidden">
            <h3>Recent</h3>
            <ul id="recent-list"></ul>
          </div>
          <ul id="dir-list"></ul>
        </div>
        <aside id="preview" class="preview hidden">
          <div class="preview-head">
            <button id="preview-back" class="ghost only-mobile">← Files</button>
            <div class="preview-meta">
              <div id="preview-path" class="mono"></div>
              <div id="preview-sub" class="muted small"></div>
            </div>
            <button id="preview-copy" class="ghost" title="Copy path">⧉ path</button>
          </div>
          <pre id="preview-body"></pre>
        </aside>
      </div>
    </div>

    <div id="tab-activity" class="tabpane hidden">
      <ul id="activity-list" class="stream"></ul>
    </div>

    <div id="tab-fleet" class="tabpane hidden">
      <div id="fleet-cards" class="cards"></div>
    </div>
  </section>

</div>
<script src="/static/app.js"></script>
</body>
</html>
